name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ v2-react ]
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add cache-busting timestamp to built assets
        run: |
          perl -0777 -i -pe 's{(\.(?:css|js))(\?[^\"]*)?(\")}{ $1 . (defined $2 ? $2 . "&cb=" . $ENV{TS} : "?cb=" . $ENV{TS}) . $3 }ge' dist/index.html
        env:
          TS: ${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
