<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <!-- Prevent aggressive browser caching while debugging deployments -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#edf2f8" media="(prefers-color-scheme: light)" />

  <!-- Favicon – mismo logo de la página -->
  <link rel="icon" type="image/x-icon" href="%BASE_URL%assets/images/favicon.ico?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/images/logo-circular.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/images/logo-circular.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%assets/images/logo-circular.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%assets/images/logo-circular.png" />
  <link rel="mask-icon" href="%BASE_URL%assets/images/logo-circular.png" color="#0f1720" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ESAMS" />

  <!-- Windows -->
  <meta name="msapplication-TileColor" content="#0f1720" />
  <meta name="msapplication-TileImage" content="%BASE_URL%assets/images/logo-circular.png" />

  <title>ESAMS | Formulador Arterial</title>
  <meta name="description" content="ESAMS — Calculadora profesional de solución arterial para embalsamamiento. Determina concentraciones, volúmenes y mezclas con precisión para formulación arterial en tanatopraxia." />
  <link rel="canonical" href="https://angeloe14.github.io/FEmbal/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ESAMS | Formulador Arterial" />
  <meta property="og:description" content="ESAMS — Calculadora profesional de solución arterial para embalsamamiento. Calcula concentraciones, volúmenes y mezclas con precisión para tanatopraxia." />
  <meta property="og:url" content="https://angeloe14.github.io/FEmbal/" />
  <meta property="og:image" content="https://angeloe14.github.io/FEmbal/assets/images/logo-circular.png" />
  <meta property="og:image:width" content="256" />
  <meta property="og:image:height" content="256" />
  <meta property="og:site_name" content="ESAMS" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:image:alt" content="ESAMS — Logotipo Escuela de Artes Mortuorias del Sureste" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ESAMS | Formulador Arterial" />
  <meta name="twitter:description" content="ESAMS — Calculadora profesional de solución arterial para embalsamamiento. Calcula concentraciones, volúmenes y mezclas con precisión para tanatopraxia." />
  <meta name="twitter:image" content="https://angeloe14.github.io/FEmbal/assets/images/logo-circular.png" />
  <meta name="twitter:image:alt" content="ESAMS — Logotipo Escuela de Artes Mortuorias del Sureste" />

  <!-- Precarga del logo (LCP) -->
  <link rel="preload" href="%BASE_URL%assets/images/logo-circular.png" as="image" fetchpriority="high" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

  <script>(function(){try{var e=localStorage.getItem("formulador-theme");"light"===e||"dark"===e?document.documentElement.setAttribute("data-theme",e):document.documentElement.setAttribute("data-theme","dark")}catch(e){}}());</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
